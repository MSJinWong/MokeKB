# Backend-only deploy: 4 containers (1 web + 3 celery workers) all using the
# same hoyanai-app image. PostgreSQL, Redis, and frontend live OUTSIDE this stack.
#
# Usage:
#   cp installer/.env.app-only.example .env
#   # edit .env (DB host, Redis host, secrets, image tag)
#   docker compose -f installer/docker-compose.app-only.yml --env-file .env up -d

x-app-env: &app-env
  MAXKB_DB_HOST: ${MAXKB_DB_HOST:?set in .env}
  MAXKB_DB_PORT: ${MAXKB_DB_PORT:-5432}
  MAXKB_DB_USER: ${MAXKB_DB_USER:?set in .env}
  MAXKB_DB_PASSWORD: ${MAXKB_DB_PASSWORD:?set in .env}
  MAXKB_DB_NAME: ${MAXKB_DB_NAME:?set in .env}
  MAXKB_DB_MAX_OVERFLOW: ${MAXKB_DB_MAX_OVERFLOW:-80}
  MAXKB_REDIS_HOST: ${MAXKB_REDIS_HOST:?set in .env}
  MAXKB_REDIS_PORT: ${MAXKB_REDIS_PORT:-6379}
  MAXKB_REDIS_PASSWORD: ${MAXKB_REDIS_PASSWORD:?set in .env}
  MAXKB_REDIS_DB: ${MAXKB_REDIS_DB:-0}
  MAXKB_ENABLE_UI: "false"
  MAXKB_ENABLE_API_DOCS: ${MAXKB_ENABLE_API_DOCS:-false}
  MAXKB_ENABLE_EMAIL: ${MAXKB_ENABLE_EMAIL:-false}
  MAXKB_TASK_QUEUE_PREFIX_ENABLED: "1"
  MAXKB_ENABLED_PROVIDERS: ${MAXKB_ENABLED_PROVIDERS:?set in .env}
  MAXKB_SECRET_KEY: ${MAXKB_DJANGO_SECRET_KEY:?set in .env}

services:
  # In-stack Redis. To use an external Redis instead:
  # set MAXKB_REDIS_HOST in .env to that host and `docker compose up -d` without
  # this service (compose will still try to start it; comment it out, or use
  # `--scale redis=0`, if you want to avoid running it).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "${MAXKB_REDIS_PASSWORD:?set in .env}"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "1gb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - hoyanai-redis-data:/data
    # Bound to loopback only — default password is weak (123456). If you
    # change MAXKB_REDIS_PASSWORD to a strong one and want LAN access, switch
    # this to "${MAXKB_REDIS_PORT:-6379}:6379".
    ports:
      - "127.0.0.1:${MAXKB_REDIS_PORT:-6379}:6379"
    healthcheck:
      # -a + ping returns "PONG" on auth success
      test: ["CMD-SHELL", "redis-cli -a \"$$MAXKB_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    environment:
      MAXKB_REDIS_PASSWORD: ${MAXKB_REDIS_PASSWORD:?set in .env}

  hoyanai-app:
    image: ${MAXKB_IMAGE:?set in .env}
    restart: unless-stopped
    # host.docker.internal lets the container reach services bound to the host's
    # 127.0.0.1 (e.g. install-postgres.sh's PG container, since they don't share
    # this compose network).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      # Cluster-wide scheduler lives on hoyanai-worker-maintenance, not on the web.
      MAXKB_ENABLE_SCHEDULER: "false"
    command: ["start", "web"]
    ports:
      - "${MAXKB_BACKEND_PORT:-8080}:8080"
    volumes:
      - hoyanai-data:/opt/maxkb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/admin/api/profile || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  hoyanai-worker-rag:
    image: ${MAXKB_IMAGE:?set in .env}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hoyanai-app:
        condition: service_healthy
    environment:
      <<: *app-env
      MAXKB_ENABLE_SCHEDULER: "false"
      MAXKB_TMPDIR: /opt/maxkb-app/tmp
      SERVER_NAME: celery
    entrypoint: ["python", "/opt/maxkb-app/apps/manage.py"]
    command: ["start", "celery_rag_parse", "celery_rag_embedding", "celery_rag_index"]
    volumes:
      - hoyanai-data:/opt/maxkb

  hoyanai-worker-default:
    image: ${MAXKB_IMAGE:?set in .env}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hoyanai-app:
        condition: service_healthy
    environment:
      <<: *app-env
      MAXKB_ENABLE_SCHEDULER: "false"
      MAXKB_TMPDIR: /opt/maxkb-app/tmp
      SERVER_NAME: celery
    entrypoint: ["python", "/opt/maxkb-app/apps/manage.py"]
    command: ["start", "celery_celery"]
    volumes:
      - hoyanai-data:/opt/maxkb

  hoyanai-worker-maintenance:
    image: ${MAXKB_IMAGE:?set in .env}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hoyanai-app:
        condition: service_healthy
    environment:
      <<: *app-env
      # Single scheduler instance for the cluster (apscheduler + celery-beat).
      MAXKB_ENABLE_SCHEDULER: "true"
      MAXKB_TMPDIR: /opt/maxkb-app/tmp
      SERVER_NAME: celery
    entrypoint: ["python", "/opt/maxkb-app/apps/manage.py"]
    command: ["start", "celery_maintenance"]
    volumes:
      - hoyanai-data:/opt/maxkb

volumes:
  hoyanai-data:
  hoyanai-redis-data:
