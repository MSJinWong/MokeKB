server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 100m;

    # Resolver for dynamic upstream resolution (compose service names)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # API proxy to backend service
    location /admin/api/ {
        set $maxkb_upstream http://maxkb-app:8080;
        proxy_pass $maxkb_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /chat/api/ {
        set $maxkb_upstream http://maxkb-app:8080;
        proxy_pass $maxkb_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Optional: proxy oss/file paths (large object download) to backend
    location ~ ^/(admin|chat)/oss/ {
        set $maxkb_upstream http://maxkb-app:8080;
        proxy_pass $maxkb_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    # Static UI: admin
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /usr/share/nginx/html/admin/index.html;
    }

    # Static UI: chat
    location /chat/ {
        alias /usr/share/nginx/html/chat/;
        try_files $uri $uri/ /usr/share/nginx/html/chat/index.html;
    }

    # Root → admin landing
    location = / {
        return 301 /admin/;
    }
}
