services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  maxkb-app:
    image: maxkb-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MAXKB_DB_HOST: postgres
      MAXKB_DB_PORT: 5432
      MAXKB_DB_USER: ${POSTGRES_USER}
      MAXKB_DB_PASSWORD: ${POSTGRES_PASSWORD}
      MAXKB_DB_NAME: ${POSTGRES_DB}
      MAXKB_REDIS_HOST: redis
      MAXKB_REDIS_PORT: 6379
      MAXKB_REDIS_PASSWORD: ${REDIS_PASSWORD}
      MAXKB_REDIS_DB: 0
      MAXKB_ENABLE_UI: "false"
      MAXKB_ENABLE_API_DOCS: ${MAXKB_ENABLE_API_DOCS:-false}
      MAXKB_ENABLE_EMAIL: ${MAXKB_ENABLE_EMAIL:-false}
      # Phase 5 split-queue mode: scheduler is now hosted by maxkb-worker-maintenance.
      MAXKB_ENABLE_SCHEDULER: "false"
      MAXKB_ENABLED_PROVIDERS: ${MAXKB_ENABLED_PROVIDERS:?MAXKB_ENABLED_PROVIDERS must be set in .env}
      MAXKB_SECRET_KEY: ${MAXKB_DJANGO_SECRET_KEY}
    command: ["start", "web"]
    volumes:
      - maxkb-data:/opt/maxkb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/admin/api/profile || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  maxkb-worker-rag:
    image: maxkb-app:latest
    restart: unless-stopped
    depends_on:
      maxkb-app:
        condition: service_healthy
    environment: &worker-env
      MAXKB_DB_HOST: postgres
      MAXKB_DB_PORT: 5432
      MAXKB_DB_USER: ${POSTGRES_USER}
      MAXKB_DB_PASSWORD: ${POSTGRES_PASSWORD}
      MAXKB_DB_NAME: ${POSTGRES_DB}
      MAXKB_REDIS_HOST: redis
      MAXKB_REDIS_PORT: 6379
      MAXKB_REDIS_PASSWORD: ${REDIS_PASSWORD}
      MAXKB_REDIS_DB: 0
      MAXKB_ENABLE_UI: "false"
      MAXKB_ENABLE_SCHEDULER: "false"
      MAXKB_TASK_QUEUE_PREFIX_ENABLED: "1"
      MAXKB_ENABLED_PROVIDERS: ${MAXKB_ENABLED_PROVIDERS:?MAXKB_ENABLED_PROVIDERS must be set in .env}
      MAXKB_SECRET_KEY: ${MAXKB_DJANGO_SECRET_KEY}
      MAXKB_TMPDIR: /opt/maxkb-app/tmp
      SERVER_NAME: celery
    # Direct Django manage.py — main.py:121 only accepts all/web/task as service names.
    entrypoint: ["python", "/opt/maxkb-app/apps/manage.py"]
    command: ["start", "celery_rag_parse", "celery_rag_embedding", "celery_rag_index"]
    volumes:
      - maxkb-data:/opt/maxkb

  maxkb-worker-default:
    image: maxkb-app:latest
    restart: unless-stopped
    depends_on:
      maxkb-app:
        condition: service_healthy
    environment: *worker-env
    entrypoint: ["python", "/opt/maxkb-app/apps/manage.py"]
    command: ["start", "celery_celery"]
    volumes:
      - maxkb-data:/opt/maxkb

  maxkb-worker-maintenance:
    image: maxkb-app:latest
    restart: unless-stopped
    depends_on:
      maxkb-app:
        condition: service_healthy
    environment:
      <<: *worker-env
      # Cluster-wide single scheduler lives on this worker (apscheduler + celery-beat).
      MAXKB_ENABLE_SCHEDULER: "true"
    entrypoint: ["python", "/opt/maxkb-app/apps/manage.py"]
    command: ["start", "celery_maintenance"]
    volumes:
      - maxkb-data:/opt/maxkb

  maxkb-ui:
    image: maxkb-ui:latest
    restart: unless-stopped
    depends_on:
      - maxkb-app
    ports:
      - "${MAXKB_PUBLIC_PORT:-8080}:80"

volumes:
  pgdata:
  maxkb-data:
